<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — Open World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: rgba(8, 14, 26, 0.72); border: 1px solid rgba(255, 45, 149, 0.45);
    border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(2px); }
  #hud-topleft { position: absolute; top: 12px; left: 12px; min-width: 190px; }
  #hud-cash { font-size: 26px; font-weight: 800; color: #37d67a; }
  #hud-health { font-size: 13px; margin-top: 2px; }
  #health-bar { height: 8px; background: #222; border-radius: 4px; margin-top: 4px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #37d67a; }
  #hud-topcenter { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
  #hud-stars { font-size: 26px; letter-spacing: 4px; color: #888; text-shadow: 0 0 8px rgba(255, 207, 63, 0.6); }
  #hud-clock { font-size: 14px; color: #cfe3ff; }
  #hud-district { font-size: 13px; color: #ff8ac2; font-weight: 700; letter-spacing: 1px; }
  #hud-topright { position: absolute; top: 12px; right: 12px; text-align: right; }
  #minimap { width: 150px; height: 150px; border: 2px solid rgba(255, 45, 149, 0.6); border-radius: 8px; }
  #hud-objective { position: absolute; left: 12px; bottom: 12px; max-width: 430px; font-size: 15px; line-height: 1.45; }
  #hud-objective b { color: #ff2d95; }
  #hud-bottomright { position: absolute; right: 12px; bottom: 12px; text-align: right; }
  #hud-speed { font-size: 30px; font-weight: 800; }
  #hud-ammo { font-size: 15px; color: #ffe27a; }
  #hud-message { position: absolute; top: 88px; left: 50%; transform: translateX(-50%);
    font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px #000;
    opacity: 0; transition: opacity 0.3s; text-align: center; max-width: 80vw; }
  #hud-help { position: absolute; right: 12px; bottom: 110px; font-size: 12px; color: #cfe3ff;
    background: rgba(8, 14, 26, 0.6); padding: 6px 10px; border-radius: 8px; line-height: 1.6; }
  #screen { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(20, 8, 40, 0.88), rgba(8, 20, 44, 0.92)); }
  #screen-card { max-width: 640px; padding: 36px 44px; text-align: center; }
  #screen-title { font-size: 64px; font-weight: 900; letter-spacing: 2px; margin: 0;
    background: linear-gradient(90deg, #ff2d95, #ffd23f, #00e5ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(255, 45, 149, 0.35); }
  #screen-subtitle { color: #ff8ac2; font-weight: 700; letter-spacing: 4px; margin: 6px 0 18px; }
  #screen-body { font-size: 16px; line-height: 1.65; color: #e8f0ff; text-align: left; }
  #screen-body b { color: #ffd23f; }
  #screen-hint { margin-top: 18px; font-size: 14px; color: #9fb6d8; }
  .btn { pointer-events: auto; display: inline-block; margin: 14px 6px 0; padding: 12px 26px; font-size: 17px;
    font-weight: 800; color: #fff; background: linear-gradient(90deg, #ff2d95, #7c4dff); border: none;
    border-radius: 10px; cursor: pointer; }
  .btn.secondary { background: rgba(255, 255, 255, 0.14); border: 1px solid #888; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Neon Bay: an open-world crime game. Drive, walk, take missions and outrun the police."></canvas>
<div id="hud">
  <div id="hud-topleft" class="panel">
    <div id="hud-cash">$250</div>
    <div id="hud-health">HP 100</div>
    <div id="health-bar"><div id="health-fill"></div></div>
  </div>
  <div id="hud-topcenter">
    <div id="hud-stars">☆☆☆☆☆</div>
    <div id="hud-clock">12:34</div>
    <div id="hud-district">Neon Strip</div>
  </div>
  <div id="hud-topright"><canvas id="minimap" width="150" height="150"></canvas></div>
  <div id="hud-objective" class="panel"><b>MISSION</b><br><span id="hud-objective-text">Loading Neon Bay…</span></div>
  <div id="hud-bottomright">
    <div id="hud-speed"></div>
    <div id="hud-ammo"></div>
  </div>
  <div id="hud-message"></div>
  <div id="hud-help">WASD move / drive · Mouse drag camera · E enter car · Click shoot · F punch<br>Space brake · R reload · M mute music · P pause · Missions auto-start</div>
</div>
<div id="screen">
  <div id="screen-card">
    <h1 id="screen-title">NEON BAY</h1>
    <div id="screen-subtitle">AN OPEN-WORLD CRIME STORY</div>
    <div id="screen-body"></div>
    <div>
      <button class="btn" id="btn-primary">Start</button>
      <button class="btn secondary" id="btn-secondary">New Game</button>
    </div>
    <div id="screen-hint"></div>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
